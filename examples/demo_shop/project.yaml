name: demo-shop
version: 0.1.0
description: Minimal demo project with customer/product/order types.
schema:
  Customer:
    id: str
    name: str
    email: str
    created_at: datetime
  Product:
    id: str
    name: str
    description:
      type: str
      required: false
      default: ''
    price: float
    created_at: datetime
  OrderItem:
    product_id: str
    count: int
    subtotal: float
  Order:
    id: str
    customer_id: str
    items: list[OrderItem]
    total: float
    placed_at: datetime
  DashboardSummary:
    customers: list[Customer]
    products: list[Product]
    orders: list[Order]
storage:
  type: sqlite
  path: demo_shop.db
security:
  roles:
    admin:
    - '*:*'
    editor:
    - '*:create'
    - '*:read'
    - '*:update'
    - '*:delete'
    viewer:
    - '*:read'
  secret_key: 1be1c7c483f5da362c0c450f9358d13586467a16a63e7c5930c73550c392657d
agent:
  type: claude_code
  model: claude-sonnet-5
  cwd: .
extensions: /Users/timo/private/crystalline/examples/demo_shop/extensions
monitoring:
  type: sqlite
  path: monitoring.db
properties: {}
