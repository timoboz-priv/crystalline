name: demo-shop
version: "0.1.0"
description: Minimal demo project with customer/product/order types.
schema:
  Customer:
    id: str
    name: str
    email: str
  Product:
    id: str
    name: str
    description:
      type: str
      required: false
      default: ""
    price: float
  OrderItem:
    product_id: str
    count: int
    subtotal: float
  Order:
    id: str
    customer_id: str
    items: list[OrderItem]
    total: float
storage:
  type: sqlite
  path: demo_shop.db
agent:
  type: claude_code
  model: claude-sonnet-5
# Records every session/turn/event (crystalline.monitoring) into its own
# sqlite file next to demo_shop.db — build_agent() wraps the agent in a
# MonitoredAgent automatically whenever this section is present; omit it
# entirely to turn monitoring off.
monitoring:
  type: sqlite
  path: monitoring.db
# Custom code, discovered and loaded automatically after this project's
# schema/storage are set up (crystalline.project.extensions.apply_extensions):
# one tool/skill per file, named tool_*.py/skill_*.py, each with a
# build_tool(project)/build_skill(project) function — see
# extensions/tool_total_revenue.py and extensions/skill_place_order.py.
extensions: extensions/
# Demo/dev-only credential, seeded into storage on first load and left
# alone afterwards — not how real deployments should manage users.
users:
  - id: admin
    password: admin123
    roles: [admin]
  - id: alice
    password: alice123
    roles: [editor]
  - id: bob
    password: bob123
    roles: [viewer]
properties: {}
